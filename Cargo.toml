[workspace]
resolver = "2"
members = [
  "crates/opens_syntax",
  "crates/opens_parser",
  "crates/opens_types",
  "crates/opens_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Steven Gazo Maliaño"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
